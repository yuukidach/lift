name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      ASSET_BASENAME: lift-universal-macos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust + targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Show toolchain
        run: |
          rustc -V
          cargo -V
          rustup target list --installed
          sw_vers

      - name: Verify release version
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"

      - name: Build release binaries
        run: |
          set -euxo pipefail
          cargo build --release --locked --bin lift --bin lift-cli --target aarch64-apple-darwin
          cargo build --release --locked --bin lift --bin lift-cli --target x86_64-apple-darwin

      - name: Create universal binaries with lipo
        run: |
          set -euxo pipefail
          mkdir -p dist

          lipo -create \
            target/aarch64-apple-darwin/release/lift \
            target/x86_64-apple-darwin/release/lift \
            -output dist/lift

          lipo -create \
            target/aarch64-apple-darwin/release/lift-cli \
            target/x86_64-apple-darwin/release/lift-cli \
            -output dist/lift-cli

          strip -x dist/lift dist/lift-cli

      - name: Package tarball
        id: pkg
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          ASSET="${ASSET_BASENAME}-${VERSION}.tar.gz"

          tar -C dist -czf "${ASSET}" lift lift-cli
          shasum -a 256 "${ASSET}" > "${ASSET}.sha256"

          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
